## Codemagic CI/CD — build & sign the iOS app (Capacitor) and upload to TestFlight.
## Runs on a Codemagic Mac build machine, so no local Mac/Xcode is needed.
##
## One-time setup in the Codemagic UI (see the iOS plan, Part 2/3):
##  1. Connect this GitHub repo and pick the branch.
##  2. Team → Integrations → App Store Connect: add your App Store Connect API key (.p8 + Key ID + Issuer ID).
##  3. Reference that integration below as `app_store_connect: <integration-name>` and set BUNDLE_ID.
##  4. Make sure GoogleService-Info.plist is committed at ios/App/App/GoogleService-Info.plist
##     (or injected via an encrypted env var / Codemagic file).

workflows:
  ios-capacitor:
    name: Seen iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicASCKey   # <-- name of your App Store Connect API key integration
    environment:
      # Signing is done explicitly in the "Set up code signing" step below (fetch-signing-files
      # --create), which creates the certificate + App Store profile for a fresh App ID. Using the
      # ios_signing shorthand here did NOT auto-create them ("No matching profiles found").
      groups:
        - ios_signing   # Codemagic env-var group holding the (secure) IOS_DIST_CERT_KEY for cert reuse
      vars:
        BUNDLE_ID: "app.seenapp.ios"
        APP_STORE_APPLE_ID: "6786136562"   # App Store Connect numeric Apple ID of the "Seen" app record
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci --legacy-peer-deps
      - name: Enable native Google sign-in (patch the auth plugin podspec)
        script: |
          # Patch @capacitor-firebase/authentication's podspec so its DEFAULT build (which registers
          # the plugin → Apple sign-in works) also compiles native Google in: adds a GoogleSignIn
          # dependency to the plugin's own pod target (so `import GoogleSignIn` resolves) + the
          # RGCFA_INCLUDE_GOOGLE flag. Must run BEFORE cap sync so its single pod install resolves
          # GoogleSignIn together with Firebase (no lockfile conflict). Do NOT use the plugin's
          # /Google subspec pod line — on device it stops the plugin registering (calls → UNIMPLEMENTED).
          node scripts/enable-google-signin.cjs
      - name: Build the web app (dist/)
        script: npm run build
      - name: Add iOS platform if missing, then sync
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
          echo "── Podfile ──"; cat ios/App/Podfile
      - name: Inject GoogleService-Info.plist + entitlements into the iOS project
        script: |
          # Copies the committed plist into ios/App/App/, registers it in the Xcode project, and adds
          # the push + Sign in with Apple entitlements. See scripts/inject-google-plist.cjs.
          npm i xcode --no-save
          node scripts/inject-google-plist.cjs
      - name: Configure Info.plist (Google URL scheme, push, export compliance)
        script: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          # Export compliance: app uses only standard HTTPS encryption (removes the TestFlight prompt).
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || $PB -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Background mode so push can wake the app.
          $PB -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          ($PB -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | grep -q remote-notification) || $PB -c "Add :UIBackgroundModes: string remote-notification" "$PLIST"
          # Google sign-in callback URL scheme (REVERSED_CLIENT_ID from GoogleService-Info.plist).
          REV="com.googleusercontent.apps.821891105119-f979aesocj9dc2edl9f5ci14d0tsjce7"
          $PB -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" "$PLIST" 2>/dev/null || $PB -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REV" "$PLIST"
          echo "Info.plist configured."
      - name: Generate app icon & splash from assets/ (non-fatal)
        script: |
          # Expands assets/icon.png (+ optional assets/splash*.png) into the iOS asset catalog.
          # Non-fatal: a missing/low-res source just falls back to the default icon.
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --ios || true; fi
      - name: Set up code signing (create cert + profile via App Store Connect API key)
        script: |
          keychain initialize
          # Distribution certificate private key. If IOS_DIST_CERT_KEY (base64 of an RSA PEM) is set
          # as an encrypted env var, reuse it every build so ONE certificate is created and reused
          # (Apple caps distribution certs at 2). Otherwise fall back to an ephemeral key (which
          # creates a new certificate each build — fine short-term, but revoke + set the env var).
          if [ -n "$IOS_DIST_CERT_KEY" ]; then
            echo "$IOS_DIST_CERT_KEY" | base64 --decode > /tmp/cert_key.pem
            echo "Using persistent distribution key (certificate is reused)."
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "NOTE: IOS_DIST_CERT_KEY not set — created an ephemeral key (new cert this build)."
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set a unique, incrementing build number
        script: |
          # App Store Connect rejects a CFBundleVersion that isn't higher than a previously uploaded
          # one. Codemagic's $BUILD_NUMBER auto-increments per build, so use it as the iOS build number.
          cd ios/App
          agvtool new-version -all "${BUILD_NUMBER:-$(date +%s)}"
      - name: Build & archive IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip to true (with a release type) when ready to ship publicly

  # ── Android (Capacitor) ─────────────────────────────────────────────────────
  # Replaces the PWABuilder TWA with a real Android app that BUNDLES the web build,
  # rather than a WebView pointing at seenapp.app. That distinction is the point: a
  # thin wrapper around a URL is exactly the profile Play's minimum-functionality
  # rules target, whereas this ships dist/ inside the package like the iOS build does.
  #
  # Trade-off, accepted deliberately: web deploys no longer reach Android users
  # instantly. Each one needs a Play release.
  #
  # PREREQUISITES — see android-config/README.md. Both are outside this file:
  #   1. android-config/google-services.json committed (Firebase → Android app,
  #      package app.seenapp.twa). Without it, push notifications do nothing.
  #   2. The PWABuilder upload key added in Codemagic as `seen_upload`, or an upload
  #      key reset requested in Play Console. A package-name match is NOT enough —
  #      Play rejects a key mismatch.
  android-capacitor:
    name: Seen Android (Capacitor)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - seen_upload          # Codemagic → Teams → Code signing identities → Android keystores
      vars:
        PACKAGE_NAME: "app.seenapp.twa"   # the package Play already knows; do NOT mint a new one
      node: 20
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci --legacy-peer-deps
      - name: Build the web app (dist/)
        script: npm run build
      - name: Add Android platform if missing, then sync
        script: |
          # The native folder is NOT committed — same as ios/. It is generated per build,
          # so every patch below has to be re-applied each time.
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Set the Android package name
        script: |
          # capacitor.config.json's single appId is app.seenapp.ios and must stay that way,
          # or the iOS bundle identifier moves out from under the App Store listing. The
          # Android package is therefore set here instead.
          set -e
          GRADLE="android/app/build.gradle"
          sed -i "s/applicationId \"[^\"]*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE"
          sed -i "s/^\s*namespace \"[^\"]*\"/    namespace \"$PACKAGE_NAME\"/" "$GRADLE"
          echo "── applicationId / namespace ──"
          grep -E "applicationId|namespace" "$GRADLE"
          # Fail loudly rather than shipping a package Play will not accept.
          grep -q "applicationId \"$PACKAGE_NAME\"" "$GRADLE" || { echo "applicationId not set"; exit 1; }
      - name: Inject google-services.json
        script: |
          if [ -f "android-config/google-services.json" ]; then
            cp android-config/google-services.json android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "!! android-config/google-services.json is MISSING."
            echo "!! Push notifications will not work. See android-config/README.md."
          fi
      - name: Generate app icon & splash from assets/ (non-fatal)
        script: |
          # Same source as iOS: assets/icon.png, which carries the Phase 5 eye mark.
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --android || true; fi
      - name: Set a unique, incrementing build number
        script: |
          # Play rejects a versionCode it has already seen.
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0) + 1))
          echo "versionCode -> $BUILD_NUMBER"
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
      - name: Build signed release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      # Deliberately left commented: the closed test is mid-run and its 14-day clock
      # restarts if the track is disturbed. Upload the first AAB by hand, confirm it
      # installs and the package/key are accepted, then enable this.
      #
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT
      #   track: internal
      #   submit_as_draft: true
      email:
        recipients:
          - prince1489@googlemail.com
