## Codemagic CI/CD — builds and signs BOTH native apps from this one repo:
##   ios-capacitor      → TestFlight automatically; submitting for review stays manual in ASC.
##   android-capacitor  → Play's INTERNAL track automatically; promoting past it stays manual.
## Runs on Codemagic's machines, so no local Mac/Xcode/Android Studio is needed.
##
## The WEB app is not built here at all — Vercel deploys it straight from the same branch. Worth
## remembering when a change seems not to have shipped: web changes need no build, and native
## changes do not reach anyone until a store release.
##
## ── One-time setup, iOS (see the iOS plan, Part 2/3) ──
##  1. Connect this GitHub repo and pick the branch.
##  2. Team → Integrations → App Store Connect: add your App Store Connect API key (.p8 + Key ID + Issuer ID).
##  3. Reference that integration below as `app_store_connect: <integration-name>` and set BUNDLE_ID.
##  4. Make sure GoogleService-Info.plist is committed at ios/App/App/GoogleService-Info.plist
##     (or injected via an encrypted env var / Codemagic file).
##
## ── One-time setup, Android ──
##  5. Google Cloud Console (project uplift-6d9ea) → **Service Accounts**, which is its own
##     sidebar item BELOW "IAM" — IAM lists who has access, not the accounts themselves.
##     Create one (e.g. codemagic-play-publisher), then Keys → Add key → Create new key → JSON.
##     SKIP the "grant this service account access to project" step: it needs no GCP role at
##     all, because its permission comes from the Play Console invite in 6. Looking for a role
##     to grant here is the usual place to get stuck. Do NOT reuse firebase-adminsdk-fbsvc —
##     that one backs FIREBASE_SERVICE_ACCOUNT_JSON for the /api routes, and sharing it means
##     rotating either key breaks the other.
##  6. Play Console → Users and permissions → invite that service account's email, granting
##     "Release to testing tracks" on Seen.
##  6b. ENABLE THE PLAY DEVELOPER API on the Cloud project — a SEPARATE gate from 6, and the one
##     that bites last because it only fails at the publish step, after a full build has already
##     succeeded and the AAB has been signed:
##       https://console.developers.google.com/apis/api/androidpublisher.googleapis.com/overview?project=821891105119
##     Step 6 grants the service account PERMISSION to publish; this switches on the API it uses
##     to do so. Having one without the other looks like a credentials problem and is not one.
##     Allow a few minutes to propagate before retrying.
##  7. Codemagic → Environment variables → paste the WHOLE JSON as GOOGLE_PLAY_SERVICE_ACCOUNT,
##     marked Secure, in a group named `google_play` (referenced by the workflow below).
##  8. Commit android-config/google-services.json, and register BOTH SHA-1 fingerprints in
##     Firebase — the upload key AND Play App Signing's, from Play Console → App integrity.
##     With only the upload key registered, Google sign-in works in testing and fails for every
##     real install.

workflows:
  ios-capacitor:
    name: Seen iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      # Pin the branch. Without this it is a per-build dropdown in the Codemagic UI, and
      # picking the wrong entry ships the wrong code to TestFlight — a mistake invisible
      # until a tester reports it.
      #
      # This pin used to name v2-preview, back when it and claude/improve-app-design-HJrCm
      # were different codebases (V2 preview vs frozen V1). They were merged, the two
      # branches became identical, and v2-preview was retired. Everything now ships from
      # claude/improve-app-design-HJrCm, which is also what Vercel deploys — the branch that
      # goes to the web and the branch that gets packaged must not be allowed to drift.
      events:
        - push
      branch_patterns:
        - pattern: claude/improve-app-design-HJrCm
          include: true
          source: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: CodemagicASCKey   # <-- name of your App Store Connect API key integration
    environment:
      # Signing is done explicitly in the "Set up code signing" step below (fetch-signing-files
      # --create), which creates the certificate + App Store profile for a fresh App ID. Using the
      # ios_signing shorthand here did NOT auto-create them ("No matching profiles found").
      groups:
        - ios_signing   # Codemagic env-var group holding the (secure) IOS_DIST_CERT_KEY for cert reuse
      vars:
        BUNDLE_ID: "app.seenapp.ios"
        APP_STORE_APPLE_ID: "6786136562"   # App Store Connect numeric Apple ID of the "Seen" app record
        # CFBundleShortVersionString — the number the App Store shows and groups builds under.
        # BUMP THIS FOR EVERY PUBLIC RELEASE. It is not the build number: BUILD_NUMBER
        # (CFBundleVersion) increments itself per upload and is invisible to users, whereas this
        # is the "1.2" a customer sees, and App Store Connect will not offer a build to a version
        # whose number it does not carry.
        #
        # Forgetting to bump it fails at UPLOAD, after a full build and archive, with:
        #   90062  CFBundleShortVersionString [x] must contain a higher version than the
        #          previously approved version [x]
        #   90186  Invalid Pre-Release Train. The train version 'x' is closed for new build
        #          submissions
        # Both mean the same thing — that version already shipped, so pick the next one. They are
        # not signing or credential problems, which is what a wall of altool JSON tends to suggest.
        MARKETING_VERSION: "1.2"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci --legacy-peer-deps
      - name: Enable native Google sign-in (patch the auth plugin podspec)
        script: |
          # Patch @capacitor-firebase/authentication's podspec so its DEFAULT build (which registers
          # the plugin → Apple sign-in works) also compiles native Google in: adds a GoogleSignIn
          # dependency to the plugin's own pod target (so `import GoogleSignIn` resolves) + the
          # RGCFA_INCLUDE_GOOGLE flag. Must run BEFORE cap sync so its single pod install resolves
          # GoogleSignIn together with Firebase (no lockfile conflict). Do NOT use the plugin's
          # /Google subspec pod line — on device it stops the plugin registering (calls → UNIMPLEMENTED).
          node scripts/enable-google-signin.cjs
      - name: Build the web app (dist/)
        script: npm run build
      - name: Add iOS platform if missing, then sync
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
          echo "── Podfile ──"; cat ios/App/Podfile
      - name: Inject GoogleService-Info.plist + entitlements into the iOS project
        script: |
          # Copies the committed plist into ios/App/App/, registers it in the Xcode project, and adds
          # the push + Sign in with Apple entitlements. See scripts/inject-google-plist.cjs.
          npm i xcode --no-save
          node scripts/inject-google-plist.cjs
      - name: Configure Info.plist (Google URL scheme, push, export compliance)
        script: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          # Export compliance: app uses only standard HTTPS encryption (removes the TestFlight prompt).
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || $PB -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Background mode so push can wake the app.
          $PB -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          ($PB -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null | grep -q remote-notification) || $PB -c "Add :UIBackgroundModes: string remote-notification" "$PLIST"
          # Google sign-in callback URL scheme (REVERSED_CLIENT_ID from GoogleService-Info.plist).
          REV="com.googleusercontent.apps.821891105119-f979aesocj9dc2edl9f5ci14d0tsjce7"
          $PB -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REV" "$PLIST" 2>/dev/null || $PB -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REV" "$PLIST"
          echo "Info.plist configured."
      - name: Generate app icon & splash from assets/ (non-fatal)
        script: |
          # Expands assets/icon.png (+ optional assets/splash*.png) into the iOS asset catalog.
          # Non-fatal: a missing/low-res source just falls back to the default icon.
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --ios || true; fi
      - name: Set up code signing (create cert + profile via App Store Connect API key)
        script: |
          keychain initialize
          # Distribution certificate private key. If IOS_DIST_CERT_KEY (base64 of an RSA PEM) is set
          # as an encrypted env var, reuse it every build so ONE certificate is created and reused
          # (Apple caps distribution certs at 2). Otherwise fall back to an ephemeral key (which
          # creates a new certificate each build — fine short-term, but revoke + set the env var).
          if [ -n "$IOS_DIST_CERT_KEY" ]; then
            echo "$IOS_DIST_CERT_KEY" | base64 --decode > /tmp/cert_key.pem
            echo "Using persistent distribution key (certificate is reused)."
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "NOTE: IOS_DIST_CERT_KEY not set — created an ephemeral key (new cert this build)."
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Stamp the marketing version and build number
        script: |
          set -e
          cd ios/App
          # TWO DIFFERENT NUMBERS, and conflating them is why a build can be impossible to ship.
          #
          # Marketing version (CFBundleShortVersionString) is the public "1.1". ios/ is NOT
          # committed — it is regenerated by `cap add ios` every build — so without this line
          # every build inherited Capacitor's template default of 1.0, and App Store Connect
          # will not let you attach a 1.0-stamped build to a 1.1 App Store version. That
          # failure appears in the ASC build picker as the build simply not being listed,
          # with nothing anywhere explaining why.
          agvtool new-marketing-version "$MARKETING_VERSION"
          # Build number (CFBundleVersion) just has to be higher than anything uploaded before.
          agvtool new-version -all "${BUILD_NUMBER:-$(date +%s)}"

          # Verify rather than trust: agvtool writes MARKETING_VERSION in build settings on
          # modern projects and CFBundleShortVersionString on older ones, and a silent no-op
          # here would only surface as a missing build in App Store Connect days later.
          #
          # The check greps agvtool's full report for the exact version rather than parsing a
          # terse flag whose output format varies by Xcode and by target count — a brittle parse
          # here would FAIL THE BUILD on a false alarm, which is worse than the bug it guards.
          echo "── marketing version report ──"
          agvtool what-marketing-version
          echo "build number -> $(agvtool what-version -terse)"
          agvtool what-marketing-version | grep -q "\"$MARKETING_VERSION\"" \
            || { echo "!! marketing version is not $MARKETING_VERSION — aborting before a mis-stamped upload"; exit 1; }
      - name: Build & archive IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip to true (with a release type) when ready to ship publicly

  # ── Android (Capacitor) ─────────────────────────────────────────────────────
  # Replaces the PWABuilder TWA with a real Android app that BUNDLES the web build,
  # rather than a WebView pointing at seenapp.app. That distinction is the point: a
  # thin wrapper around a URL is exactly the profile Play's minimum-functionality
  # rules target, whereas this ships dist/ inside the package like the iOS build does.
  #
  # Trade-off, accepted deliberately: web deploys no longer reach Android users
  # instantly. Each one needs a Play release.
  #
  # PREREQUISITES — see android-config/README.md. Both are outside this file:
  #   1. android-config/google-services.json committed (Firebase → Android app,
  #      package app.seenapp.twa). Without it, push notifications do nothing.
  #   2. The PWABuilder upload key added in Codemagic as `seen_upload`, or an upload
  #      key reset requested in Play Console. A package-name match is NOT enough —
  #      Play rejects a key mismatch.
  android-capacitor:
    name: Seen Android (Capacitor)
    # Plain `linux`, not `linux_x2`. The x2 tier failed pre-flight with "The selected instance
    # type is not available with the current billing plan" — it is a higher-resource tier not
    # included on every Codemagic plan. Nothing in this build (a standard Capacitor
    # build/sign/package, no heavy compilation) needs the extra resources, so this is not a
    # downgrade in practice — only in what the account is billed for.
    instance_type: linux
    max_build_duration: 60
    triggering:
      # Pin the branch. Without this it is a per-build dropdown in the Codemagic UI, and
      # picking the wrong entry ships the wrong code to TestFlight — a mistake invisible
      # until a tester reports it.
      #
      # This pin used to name v2-preview, back when it and claude/improve-app-design-HJrCm
      # were different codebases (V2 preview vs frozen V1). They were merged, the two
      # branches became identical, and v2-preview was retired. Everything now ships from
      # claude/improve-app-design-HJrCm, which is also what Vercel deploys — the branch that
      # goes to the web and the branch that gets packaged must not be allowed to drift.
      events:
        - push
      branch_patterns:
        - pattern: claude/improve-app-design-HJrCm
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        # Holds GOOGLE_PLAY_SERVICE_ACCOUNT (secure) — the whole service-account JSON, pasted as
        # one variable. Codemagic → Environment variables, group name must match this exactly.
        # Without this line the variable is simply undefined and the publish step below fails
        # AFTER a full build has run, which is a slow way to learn about a typo.
        - google_play
      android_signing:
        - seen_upload          # Codemagic → Teams → Code signing identities → Android keystores
      vars:
        PACKAGE_NAME: "app.seenapp.twa"   # the package Play already knows; do NOT mint a new one
        # Public version string. BUMP THIS whenever a build is meant to be distinguishable from
        # the last one. Play only enforces versionCode uniqueness, so this is cosmetic to Play —
        # but it is the ONLY version a person can see. Settings -> Apps shows this, not the
        # version code, so two different bundles both labelled 1.2 are indistinguishable on a
        # device. That happened: production carried a broken versionCode 2 and internal carried
        # versionCode 3, both displaying "1.2", and there was no way to tell which one a phone
        # had installed without uninstalling.
        ANDROID_VERSION_NAME: "1.3"
        # Play's target API requirement, not a preference. It moves every August — an app must
        # target an API level released within the last year — so this is expected to be bumped
        # annually, ahead of the deadline Play shows under Policy status.
        TARGET_SDK: "36"                  # Android 16; required from 31 Aug 2026
      node: 20
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci --legacy-peer-deps
      - name: Build the web app (dist/)
        script: npm run build
      - name: Add Android platform if missing, then sync
        script: |
          # The native folder is NOT committed — same as ios/. It is generated per build,
          # so every patch below has to be re-applied each time.
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Set the Android package name
        script: |
          # capacitor.config.json's single appId is app.seenapp.ios and must stay that way,
          # or the iOS bundle identifier moves out from under the App Store listing. The
          # Android package is therefore set here instead.
          set -e
          GRADLE="android/app/build.gradle"

          # ONLY applicationId. Do NOT touch `namespace`.
          #
          # These are different things and only one of them is the app's identity:
          #   applicationId — what Play and the device know the app as. Must be app.seenapp.twa.
          #   namespace     — the compile-time Java package for the R class, and what Android
          #                   resolves RELATIVE manifest class names against.
          #
          # `cap add android` generates MainActivity in the package taken from capacitor.config
          # .json's appId, i.e. app.seenapp.ios.MainActivity, and Capacitor's AndroidManifest
          # declares it relatively as android:name=".MainActivity". Rewriting namespace to
          # app.seenapp.twa therefore made Android look for app.seenapp.twa.MainActivity, which
          # does not exist — so the launcher icon started the process, the class was not found,
          # and it died before drawing a single frame. On device that looks exactly like "the app
          # does not open": launch animation, then straight back to the home screen, with no
          # crash dialog and no data or battery recorded against the app.
          #
          # applicationId and namespace differing is completely normal and is the correct state
          # here.
          sed -i "s/applicationId \"[^\"]*\"/applicationId \"$PACKAGE_NAME\"/" "$GRADLE"
          echo "── applicationId / namespace ──"
          grep -E "applicationId|namespace" "$GRADLE"
          grep -q "applicationId \"$PACKAGE_NAME\"" "$GRADLE" || { echo "!! applicationId not set"; exit 1; }

          # Assert the launcher activity actually EXISTS at the package the manifest resolves to.
          # This is the check whose absence shipped a build that could not start.
          NS=$(grep -oP '(?<=namespace ")[^"]+' "$GRADLE" | head -1)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          ACT=$(grep -oP '(?<=android:name=")\.?[A-Za-z0-9_.]*MainActivity' "$MANIFEST" | head -1)
          case "$ACT" in
            .*) FQCN="${NS}${ACT}" ;;   # relative name resolves against the namespace
            *)  FQCN="$ACT" ;;          # already fully qualified
          esac
          SRC="android/app/src/main/java/$(echo "$FQCN" | tr '.' '/').java"
          echo "namespace=$NS  manifest activity=$ACT  -> expects $SRC"
          [ -f "$SRC" ] || {
            echo "!! The manifest resolves its launcher to $FQCN but no such source file exists."
            echo "!! The app would install and then die on launch with ClassNotFoundException."
            echo "!! Present instead:"; find android/app/src/main/java -name 'MainActivity.*' | sed 's/^/!!   /'
            exit 1
          }
      - name: Raise the target API level to Play's minimum
        script: |
          set -e
          # DO NOT rely on Capacitor's default. @capacitor/android 7.6.7 targets SDK 35
          # (node_modules/@capacitor/android/capacitor/build.gradle), and Play requires 36 from
          # 31 Aug 2026 — so an unpatched Capacitor build is born non-compliant and cannot be
          # released, which is the same wall the PWABuilder TWA hit at 35.
          #
          # variables.gradle is regenerated by `cap add android` every build, so this is patched
          # per build rather than committed. rootProject.ext.targetSdkVersion is what the
          # Capacitor module reads, so setting it here reaches every plugin too, not just :app.
          V="android/variables.gradle"
          sed -i "s/^\( *\)targetSdkVersion *=.*/\1targetSdkVersion = $TARGET_SDK/"   "$V"
          sed -i "s/^\( *\)compileSdkVersion *=.*/\1compileSdkVersion = $TARGET_SDK/" "$V"

          # Google sign-in, and this one fails at RUNTIME rather than at build time.
          # @capacitor-firebase/authentication defaults rgcfaIncludeGoogle to false
          # (android/build.gradle:6). With it false, play-services-auth and the credentials
          # libraries are compileOnly — the APK builds cleanly and the classes are simply absent on
          # the device, so signInWithGoogle() throws the moment a user taps it. This is the Android
          # twin of the iOS podspec patch in scripts/enable-google-signin.cjs.
          grep -q "rgcfaIncludeGoogle" "$V" \
            && sed -i "s/^\( *\)rgcfaIncludeGoogle *=.*/\1rgcfaIncludeGoogle = true/" "$V" \
            || sed -i "s/^\( *\)minSdkVersion\(.*\)$/\1minSdkVersion\2\n\1rgcfaIncludeGoogle = true/" "$V"

          echo "── variables.gradle ──"; grep -E "minSdk|compileSdk|targetSdk|rgcfaIncludeGoogle" "$V"
          # Silent sed misses here surface days later — one as a Play policy rejection, the other
          # as a crash report from a user who tried to sign in. Assert both.
          grep -qE "^ *targetSdkVersion *= *$TARGET_SDK\b" "$V" || { echo "!! targetSdkVersion not set to $TARGET_SDK"; exit 1; }
          grep -qE "^ *rgcfaIncludeGoogle *= *true\b" "$V" || { echo "!! rgcfaIncludeGoogle not enabled — Google sign-in would crash on device"; exit 1; }
      - name: Configure Gradle to sign with the upload keystore
        script: |
          set -e
          APP="android/app/build.gradle"
          # android_signing: [seen_upload] puts the keystore on the machine and exports CM_*
          # variables — and that is ALL it does. Capacitor's generated build.gradle has no
          # signingConfigs block, so bundleRelease happily produces an UNSIGNED aab and reports
          # success. Play then rejects it at upload with "All uploaded bundles must be signed",
          # after the entire build has already run.
          #
          # Names only, never values — these are secrets. If the four used below are absent, this
          # list shows what Codemagic actually exported.
          echo "-- CM_* variables available (names only) --"
          env | grep -o '^CM_[A-Z_]*' | sort -u || echo "  (none)"

          if grep -q "signingConfigs" "$APP"; then
            echo "signingConfigs already present -- skipping"
          else
            python3 scripts/patch-android-signing.py "$APP"
          fi
          python3 scripts/patch-android-signing.py --verify "$APP"
      - name: Inject google-services.json
        script: |
          if [ -f "android-config/google-services.json" ]; then
            cp android-config/google-services.json android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "!! android-config/google-services.json is MISSING."
            echo "!! Google sign-in AND push will not work. See android-config/README.md."
          fi
      - name: Verify the Firebase Gradle wiring
        script: |
          set -e
          ROOT="android/build.gradle"; APP="android/app/build.gradle"
          # google-services.json is INERT unless the com.google.gms.google-services Gradle plugin
          # parses it into resources. Copying the file in is not enough, and nothing about a
          # missing plugin fails the build — it fails at runtime, on a device, as "sign-in does
          # nothing", which is the worst place to discover it.
          #
          # This VERIFIES rather than patches, deliberately. Capacitor's own app/build.gradle
          # already applies the plugin conditionally when the file is present, and its root
          # build.gradle ships the classpath for exactly that reason. Editing a generated file we
          # have not inspected risks duplicating the classpath or breaking that conditional — so
          # the build reports what is actually there, and only refuses to continue when the
          # combination is unambiguously broken.
          echo "── google-services wiring ──"
          echo "classpath in root build.gradle:"; grep -n "com.google.gms:google-services" "$ROOT" || echo "  (none)"
          echo "plugin applied in app/build.gradle:"; grep -n "com.google.gms.google-services" "$APP" || echo "  (none)"

          if [ -f "android/app/google-services.json" ]; then
            grep -q "com.google.gms.google-services" "$APP" \
              || { echo "!! google-services.json is present but NOTHING applies the plugin that reads it."; \
                   echo "!! Firebase would be inert: no Google sign-in, no push. Add the plugin to $APP."; exit 1; }
            grep -q "com.google.gms:google-services" "$ROOT" \
              || { echo "!! The plugin is applied but its classpath is missing from $ROOT."; \
                   echo "!! Add classpath 'com.google.gms:google-services:4.4.2' to the buildscript block."; exit 1; }
            echo "OK — config present, and the plugin that reads it is wired."
          else
            echo "!! No google-services.json in the build — Firebase is not configured."
          fi
      - name: Generate app icon & splash from assets/ (non-fatal)
        script: |
          # Same source as iOS: assets/icon.png, which carries the Phase 5 eye mark.
          if [ -f "assets/icon.png" ]; then npx @capacitor/assets generate --android || true; fi
      - name: Set a unique, incrementing build number
        script: |
          set -e
          # Play rejects a versionCode it has already seen.
          #
          # This used to swallow its own failure: no --credentials, stderr to /dev/null, and
          # `|| echo 0` turning any error into versionCode 1 — which is the TWA's existing
          # version code, so the upload was rejected as a duplicate with nothing saying why.
          # A lookup that cannot run must FAIL rather than invent a number.
          LATEST=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials @env:GOOGLE_PLAY_SERVICE_ACCOUNT)
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "!! Could not read the latest version code from Play. Got: '$LATEST'"
              echo "!! Check GOOGLE_PLAY_SERVICE_ACCOUNT and that the Play Developer API is on."
              exit 1 ;;
          esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "latest on Play: $LATEST -> building versionCode $BUILD_NUMBER"
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
          # Keep the public version string in step with iOS rather than sitting at 1.0 forever.
          sed -i "s/versionName \"[^\"]*\"/versionName \"$ANDROID_VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode $BUILD_NUMBER" android/app/build.gradle \
            || { echo "!! versionCode was not applied"; exit 1; }
      - name: Build signed release AAB
        script: |
          set -e
          cd android
          ./gradlew bundleRelease
          cd ..
          # Prove it is signed HERE, not at the publish step. An unsigned bundle builds cleanly
          # and only fails after upload, which is the slowest possible way to find out.
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "verifying signature on $AAB"
          jarsigner -verify "$AAB" \
            || { echo "!! The AAB is NOT signed. Play will reject it."; exit 1; }
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      # INTERNAL, and only internal. This is the first time this codebase runs in a WebView rather
      # than in Chrome, so Google sign-in, push and the hardware back button are all genuinely
      # untested. Internal testing has no tester minimum and no 14-day clock, so it costs nothing
      # to land every push there — while promotion to closed or production stays a decision
      # somebody makes, not a side effect of pushing a commit.
      #
      # This used to be commented out "because the closed test is mid-run and its 14-day clock
      # restarts if the track is disturbed". That no longer applies: production is live, the
      # organisation account was never subject to the 12-tester rule, and the clock tracked
      # tester opt-in rather than builds in any case.
      #
      # NOT submit_as_draft. A draft waits for a click in Play Console before anyone can install
      # it, which puts back the exact round trip this removes.
      #
      # If the first run fails with a "changes not sent for review" error, the listing has an edit
      # pending — either clear it in Play Console or add `changes_not_sent_for_review: true` here.
      # That is a pending-edit problem, not a broken credential.
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT
        track: internal
      # Kept alongside: a copy of the artifact in the inbox is still what you want on the day a
      # publish fails.
      email:
        recipients:
          - prince1489@googlemail.com
