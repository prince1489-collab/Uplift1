<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- user-scalable=no + maximum-scale=1: no page pinch-zoom anywhere (WKWebView + Android
         respect it). The World Map zooms via its own canvas gesture handlers, unaffected. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Seen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#D24341" />

    <!-- ── Link previews ──────────────────────────────────────────────────────
         Seen's growth loop is people sharing an invite link (`?add=<uid>`, see
         UpliftRetentionFeatures.jsx) into WhatsApp, iMessage, Instagram and Discord. Without
         these tags every one of those shares rendered as a bare grey URL reading "Seen",
         which is the weakest possible version of a personal recommendation.

         og:image MUST be absolute — relative paths are silently dropped by every scraper —
         and the canonical host is www.seenapp.app, the domain verified with Play. index.html
         is served no-cache (vercel.json), so edits here take effect on the next deploy;
         the scrapers themselves cache for days, so use each platform's debugger to refresh
         rather than assuming a change didn't land.

         The card is deliberately identical for every visitor. Personalising it
         ("Mahiman invited you") needs a serverless route rendering per-uid OG tags, which is
         worth doing once the loop is proven, not before. -->
    <title>Seen — Send kindness to a stranger, anywhere in the world</title>
    <meta name="description" content="Send a kind message to someone, somewhere in the world — and get encouragement back when you need it. No ads, no arguments. Free on Android and the web." />
    <link rel="canonical" href="https://www.seenapp.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seen" />
    <meta property="og:url" content="https://www.seenapp.app/" />
    <meta property="og:title" content="Seen — Small acts. Real connection." />
    <meta property="og:description" content="Send a kind message to someone, somewhere in the world — and get encouragement back when you need it. A calmer, kinder corner of the internet." />
    <meta property="og:image" content="https://www.seenapp.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Seen — a tree whose canopy forms a heart, above the words Small acts. Real connection." />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seen — Small acts. Real connection." />
    <meta name="twitter:description" content="Send a kind message to someone, somewhere in the world — and get encouragement back when you need it." />
    <meta name="twitter:image" content="https://www.seenapp.app/og-image.png" />
    <meta name="twitter:image:alt" content="Seen — a tree whose canopy forms a heart, above the words Small acts. Real connection." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      button, a, [role="button"] { touch-action: manipulation; }
      html, body { overscroll-behavior: none; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ── Phase 5 rebrand: the LA-sunset palette ────────────────────────────
      // The app's colour lives almost entirely in Tailwind utility classes
      // (bg-teal-600, text-teal-700, …), so the whole re-skin happens here by
      // redefining the scales rather than rewriting hundreds of class names.
      //   teal    -> coral        the one primary accent
      //   emerald -> warm orange  pairs with coral in gradients
      //   sky     -> dusky pink   so sky+teal gradients read as a sunset
      //   rose    -> a deeper, cooler red, kept DELIBERATELY distinct from coral
      //             so "primary action" and "something went wrong" never blur
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              display: ["DM Serif Display", "Georgia", "serif"],
            },
            colors: {
              teal: {
                50:"#FFF1F0",100:"#FFE0DE",200:"#FFC4C0",300:"#FFA09A",400:"#FF8580",
                500:"#FF6B6B",600:"#D24341",700:"#A82E2C",800:"#962B2A",900:"#762322",
                950:"#451212",
              },
              emerald: {
                50:"#FFF6EF",100:"#FFEAD8",200:"#FFD4B0",300:"#FFBC85",400:"#FFAD6E",
                500:"#FF9E57",600:"#E07C33",700:"#B85F1D",800:"#914A18",900:"#733B15",
                950:"#421F08",
              },
              sky: {
                50:"#FEF2F8",100:"#FDE4F0",200:"#FBCBE2",300:"#F9A8CE",400:"#F68CBF",
                500:"#F472B6",600:"#DB4E97",700:"#B93878",900:"#7C2450",800:"#962E61",
                950:"#4A122E",
              },
              rose: {
                50:"#FEF2F2",100:"#FEE2E2",200:"#FECACA",300:"#FCA5A5",400:"#F26B6B",
                500:"#DC2626",600:"#C41B1B",700:"#9F1717",800:"#821717",900:"#6D1818",
                950:"#450A0A",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
