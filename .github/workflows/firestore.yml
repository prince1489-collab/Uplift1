# Deploys firestore.rules and firestore.indexes.json to Firebase.
#
# WHY THIS EXISTS
# Rules and indexes live in this repo but the repo has no connection to Firebase. Nothing
# published them unless a person remembered to run `npm run deploy:rules` from a checkout —
# and that has now failed three separate times:
#
#   - Rules went 24 days undeployed. Private replies, shared reflections and public profiles
#     were denied for every user, and the app told them to check their connection.
#   - Indexes had never been declared anywhere. A query failed on the server while the local
#     cache made it look like it had briefly worked: a reply appeared, then vanished.
#   - The `follows` rule shipped and following silently failed until it was published by hand.
#
# The common cause is not carelessness — it is that deploying was a manual step outside the
# thing that ships. So it moves in here. Every push that touches these files publishes them.
#
# It also means the deploy no longer needs a machine that can run commands: `workflow_dispatch`
# puts a "Run workflow" button in the GitHub web UI, which is the whole procedure on a locked
# down laptop.
#
# ONE-TIME SETUP: a repository secret named FIREBASE_SERVICE_ACCOUNT holding the JSON key for a
# service account with `Firebase Rules Admin` + `Cloud Datastore Index Admin`. See DEPLOY.md.
#
# NOTE: there is one Firebase project, so there is no staging. A rules change on the working
# branch reaches live users immediately — the same as already happens via Vercel, but worth
# knowing that this branch is production for rules too.

name: Deploy Firestore rules and indexes

on:
  push:
    branches:
      - claude/improve-app-design-HJrCm
      - main
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/firestore.yml
  # Lets the deploy be triggered from the browser, with no checkout and no CLI.
  workflow_dispatch:

# Two pushes in quick succession must not race to publish rules. Later run wins; we do NOT
# cancel in-progress ones, because a half-finished index deploy is worse than a queued one.
concurrency:
  group: firestore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gate the deploy on the repo's own completeness check before touching Firebase: it
      # catches a collection the app writes that the rules file never mentions, which is
      # denied by default the moment it ships. Uses only Node built-ins, so no `npm ci`.
      - name: Check every collection the app uses has a rule
        run: node scripts/check-rules.cjs

      # The ONE-TIME SETUP above is a precondition, not a suggestion, and until it is done this
      # job cannot deploy anything. Without this step the run dies inside
      # google-github-actions/auth with:
      #
      #   the GitHub Action workflow must specify exactly one of "workload_identity_provider"
      #   or "credentials_json"!
      #
      # — which describes that action's input contract and says nothing about the actual
      # problem, namely that the repository secret does not exist. This workflow failed three
      # times over six weeks with that message and never once named the cause.
      #
      # Passed through `env:` rather than read in an `if:`, because secrets are not available to
      # job-level conditionals. Only the length is ever tested, so the value cannot leak into a
      # public log.
      - name: Check the deploy credentials exist
        env:
          CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CREDS" ]; then
            echo "::error::The repository secret FIREBASE_SERVICE_ACCOUNT is not set, so rules and indexes cannot be deployed."
            echo ""
            echo "Nothing was published. The live rules are untouched."
            echo ""
            echo "To fix it once, ever (full steps in DEPLOY.md):"
            echo "  1. Firebase Console -> Project settings -> Service accounts -> Manage service"
            echo "     account permissions -> Create service account, named github-firestore-deploy."
            echo "  2. Grant it 'Firebase Rules Admin' and 'Cloud Datastore Index Admin'."
            echo "  3. Its Keys tab -> Add key -> Create new key -> JSON."
            echo "  4. This repo -> Settings -> Secrets and variables -> Actions -> New repository"
            echo "     secret, named exactly FIREBASE_SERVICE_ACCOUNT, value = the whole JSON file."
            echo "  5. Re-run this job from the Actions page."
            echo ""
            echo "To publish rules RIGHT NOW without any of that, DEPLOY.md has a browser-only"
            echo "route that needs no machine you can run commands on."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT is present (${#CREDS} characters). Continuing."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # This step exports GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools reads — so no
      # `firebase login:ci` token is needed. That matters: generating one would itself require
      # running the CLI somewhere, which is the problem this workflow exists to remove.
      #
      # Deliberately NO --force. If a deploy would DELETE an index, this job fails loudly
      # rather than destroying it quietly; a dropped index is a query that breaks in
      # production and looks like data vanishing.
      - name: Deploy rules and indexes
        run: npx --yes firebase-tools deploy --only firestore --project uplift-6d9ea --non-interactive

      - name: What just happened
        run: |
          echo "Published firestore.rules and firestore.indexes.json to uplift-6d9ea."
          echo "Indexes take a few minutes to build: Firebase Console -> Firestore -> Indexes"
          echo "shows Building, then Enabled. Queries needing one keep failing until Enabled."
